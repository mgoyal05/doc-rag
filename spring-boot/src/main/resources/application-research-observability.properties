# Opt-in runtime profile; package the host with -Presearch-observability first.
management.otlp.metrics.export.url=http://localhost:14318/v1/metrics
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.connect-timeout=1s
management.otlp.metrics.export.read-timeout=2s
management.otlp.metrics.export.batch-size=100
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:14318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.connect-timeout=1s
management.opentelemetry.tracing.export.otlp.timeout=2s
management.opentelemetry.tracing.export.timeout=2s
management.opentelemetry.tracing.export.max-queue-size=256
management.opentelemetry.tracing.export.max-batch-size=32
management.opentelemetry.tracing.export.schedule-delay=5s
management.tracing.sampling.probability=1.0
management.logging.export.otlp.enabled=false
logging.structured.format.console=ecs
logging.structured.format.file=ecs
