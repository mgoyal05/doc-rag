name: DocRAG checks
on: [ push, pull_request, workflow_dispatch ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: research_test
          POSTGRES_PASSWORD: research-test-only
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres -d research_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      RESEARCH_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/research_test
      RESEARCH_TEST_DB_USER: postgres
      RESEARCH_TEST_DB_PASSWORD: research-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Provision vector extension in the isolated test database
        env:
          PGPASSWORD: research-test-only
        run: psql -h 127.0.0.1 -U postgres -d research_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Build and test all libraries and the standalone application
        env:
          RESEARCH_SIMULATION_URL: http://127.0.0.1:55492
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source-release.py
          curl --fail --location --retry 0 https://dl-cli.pstmn.io/download/version/1.75.0/linux64 -o "$RUNNER_TEMP/postman.tgz"
          mkdir -p "$RUNNER_TEMP/postman-cli"
          tar -xzf "$RUNNER_TEMP/postman.tgz" -C "$RUNNER_TEMP/postman-cli"
          ln -s postman-cli "$RUNNER_TEMP/postman-cli/postman"
          export PATH="$RUNNER_TEMP/postman-cli:$PATH"
          postman simulation run postman/simulations/research.sim.yaml --port 55492 --no-history --output ndjson > "$RUNNER_TEMP/docrag-simulation.ndjson" 2> "$RUNNER_TEMP/docrag-simulation.err" &
          simulation_pid=$!
          trap 'pkill -INT -f "simulation run postman/simulations/research.sim.yaml" || true' EXIT
          for attempt in $(seq 1 30); do
            grep -q '"event":"listening"' "$RUNNER_TEMP/docrag-simulation.ndjson" && break
            kill -0 "$simulation_pid" || { cat "$RUNNER_TEMP/docrag-simulation.err"; exit 1; }
            sleep 1
          done
          grep -q '"event":"listening"' "$RUNNER_TEMP/docrag-simulation.ndjson"
          sh scripts/build.sh -B --no-transfer-progress
          grep -q '"event":"request"' "$RUNNER_TEMP/docrag-simulation.ndjson"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Browser checks
        working-directory: widget
        run: |
          npm ci --ignore-scripts
          npx puppeteer browsers install chrome
          npm test
      - name: Dependency security scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: table
          output-file: ${{ runner.temp }}/docrag-grype-report.txt
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-rag-test-reports
          path: '**/surefire-reports/*.xml'
          if-no-files-found: warn
      - name: Dependency scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-rag-dependency-scan
          path: ${{ runner.temp }}/docrag-grype-report.txt
          if-no-files-found: ignore
